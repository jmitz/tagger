; Bring-up probe: tests two PN532 readers over I2C (reader 1: GPIO18/17, reader 2: onboard bus GPIO8/7).
[env:probe]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_mode = qio
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
