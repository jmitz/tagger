; System check: 2x PN532 over SPI (SCK11 MOSI10 MISO9, SS 17/18, RST 39/40), HX711 (DT21 SCK38), onboard I2C.
[env:probe]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_mode = qio
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
