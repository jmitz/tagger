# Tagger: touch client for Spoolman on the Waveshare ESP32-S3 3.5" touch LCD.
#
# Hardware and pin decisions are documented in ../agent.md. Summary:
#   LCD    ST7796 320x480, SPI: SCLK GPIO5, MOSI GPIO1, DC GPIO3, no CS,
#          reset on TCA9554 EXIO1, backlight GPIO6
#   Touch  FT6336 @0x38 on the onboard I2C bus (SDA GPIO8, SCL GPIO7)
#   NFC    2x PN532 on a second SPI bus: SCK GPIO11, MOSI GPIO10, MISO GPIO9,
#          SS GPIO17 (reader 1) / GPIO18 (reader 2)
#   Scale  HX711 DT GPIO21, SCK GPIO38; calibration from tools/scale_cal
#
# The UI and Spoolman logic live in the local component components/tagger_app
# (C++, LVGL built in code). Each spool carries two tags; tags are linked with
# Spoolman's native tag API and resolved via POST /api/v1/tag/scan. "Send weight"
# calls PUT /api/v1/spool/{id}/measure with the captured gross weight.
#
# Build/flash over USB:   venv/bin/esphome run esphome/tagger.yaml --device /dev/ttyACM0
# Secrets: copy esphome/secrets.example.yaml to esphome/secrets.yaml.

substitutions:
  name: tagger
  friendly_name: Tagger
  # Scale calibration (tools/scale_cal/calibration.json, 2026-11-19)
  scale_counts_per_gram: "441.8879"
  scale_default_tare: "-82537.5"
  # Spoolman base URL, e.g. http://192.168.0.10:7912 ("http://" is added if missing)
  spoolman_url: !secret spoolman_url

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0
  on_boot:
    priority: 600
    then:
      - lambda: |-
          // Log the AXP2101 power-rail enables so a dark screen can be traced to
          // power vs. display init. 0x80 = DCDC enables, 0x90 = LDO enables.
          uint8_t dcdc = 0, ldo = 0;
          const uint8_t r_dcdc = 0x80, r_ldo = 0x90;
          id(bus_board).write_readv(0x34, &r_dcdc, 1, &dcdc, 1);
          id(bus_board).write_readv(0x34, &r_ldo, 1, &ldo, 1);
          ESP_LOGI("tagger", "AXP2101 DCDC enable=0x%02X LDO enable=0x%02X", dcdc, ldo);
          id(app).set_tare_action([]() { id(tare_button).press(); });

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

tagger_app:
  id: app
  spoolman_url: ${spoolman_url}
  stable_band: 2.0    # g: max spread to count as stable
  stable_time: 2s

http_request:   # pulls in ESP-IDF's esp_http_client used by tagger_app
  timeout: 6s
  verify_ssl: false

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG
  logs:
    pn532: INFO
    sensor: INFO
    hx711: INFO
    lvgl: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s   # never reboot just because Wi-Fi is missing
  ap:
    ssid: "Tagger Setup"
    password: !secret ap_password

captive_portal:

# No Home Assistant / native API: the device reports to Spoolman instead.

ota:
  - platform: esphome
    password: !secret ota_password

# Battery: AXP2101 PMU (I2C 0x34) - read-only. Its fuel gauge and VBAT ADC are
# already enabled at power-up (0x18 bit3, 0x30 bit0), so nothing is written.
#   0x00 bit3 battery present, bit5 VBUS (USB) good
#   0x01 bits6:5 current direction (01 charging, 10 discharging)
#   0x34/0x35 VBAT in mV (14-bit), 0xA4 state of charge in %
interval:
  - interval: 10s
    then:
      - lambda: |-
          auto rd = [&](uint8_t reg) -> uint8_t {
            uint8_t v = 0;
            id(bus_board).write_readv(0x34, &reg, 1, &v, 1);
            return v;
          };
          uint8_t st1 = rd(0x00), st2 = rd(0x01);
          int mv = ((rd(0x34) & 0x3F) << 8) | rd(0x35);
          int pct = rd(0xA4);
          bool present = st1 & 0x08;
          bool usb = st1 & 0x20;
          bool charging = ((st2 >> 5) & 3) == 1;
          id(app).set_battery(present, pct > 100 ? 100 : pct, mv, usb, charging);

# ------------------------------------------------------------------ buses
i2c:
  - id: bus_board
    sda: GPIO8
    scl: GPIO7
    frequency: 400kHz
    scan: true

pca9554:
  - id: exio            # TCA9554 I/O expander (EXIO1 = LCD reset)
    i2c_id: bus_board
    address: 0x20

spi:
  - id: spi_lcd
    clk_pin: GPIO5
    mosi_pin: GPIO1
    interface: spi2
  - id: spi_rfid
    clk_pin: GPIO11
    mosi_pin: GPIO10
    miso_pin: GPIO9
    interface: spi3

# ------------------------------------------------------------------ display
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO6
    frequency: 5000Hz

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

display:
  - platform: mipi_spi
    id: lcd
    model: ST7796
    spi_id: spi_lcd
    dc_pin: GPIO3
    reset_pin:
      pca9554: exio
      number: 1
    data_rate: 40MHz
    # CS is hard-wired low (R16), so the panel never sees a CS edge; it needs
    # MODE0 like the Waveshare driver. ESPHome defaults to MODE3 without a CS pin.
    spi_mode: MODE0
    color_order: bgr
    invert_colors: true
    # Keep the model's default mirror_x: overriding it mirrors the image.
    # Landscape rotation is set on lvgl (ESPHome requires it there).
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: ft63x6
    id: touch
    i2c_id: bus_board
    address: 0x38
    display: lcd

# ------------------------------------------------------------------ NFC
pn532_spi:
  - id: reader_1
    spi_id: spi_rfid
    cs_pin: GPIO17
    data_rate: 1MHz
    update_interval: 500ms
    on_tag:
      then:
        - lambda: id(app).on_tag(0, x, tag.get_tag_type());
    on_tag_removed:
      then:
        - lambda: id(app).on_tag_removed(0);
  - id: reader_2
    spi_id: spi_rfid
    cs_pin: GPIO18
    data_rate: 1MHz
    update_interval: 500ms
    on_tag:
      then:
        - lambda: id(app).on_tag(1, x, tag.get_tag_type());
    on_tag_removed:
      then:
        - lambda: id(app).on_tag_removed(1);

# ------------------------------------------------------------------ scale
globals:
  - id: scale_tare
    type: float
    restore_value: true
    initial_value: ${scale_default_tare}

sensor:
  - platform: hx711
    id: scale_raw
    internal: true
    dout_pin: GPIO21
    clk_pin: GPIO38
    gain: 128
    update_interval: 250ms
    filters:
      - median:
          window_size: 5
          send_every: 1
  - platform: template
    id: scale_weight
    name: Spool weight
    unit_of_measurement: g
    device_class: weight
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 250ms
    lambda: |-
      if (isnan(id(scale_raw).state)) return {};
      return (id(scale_raw).state - id(scale_tare)) / ${scale_counts_per_gram};
    filters:
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1
    on_value:
      then:
        - lambda: id(app).on_weight(x);

button:
  - platform: template
    id: tare_button
    name: Tare scale
    on_press:
      then:
        - lambda: |-
            if (!isnan(id(scale_raw).state)) {
              id(scale_tare) = id(scale_raw).state;
              ESP_LOGI("tagger", "Scale tared at %.1f counts", id(scale_tare));
            }

# ------------------------------------------------------------------ UI
# The screens are built in C++ by tagger_app (landscape 480x320). ESPHome only
# compiles the LVGL fonts and widget types that appear in this YAML, so the
# style definitions and the never-shown "_uses" page below declare everything
# the C++ UI uses (now and in later phases).
lvgl:
  displays: [lcd]
  touchscreens: [touch]
  # Native panel is 320x480 portrait; the unit is mounted landscape.
  # 90 was upside down for this mounting.
  rotation: 270
  buffer_size: 25%
  bg_color: 0x101418
  default_font: montserrat_16
  on_boot:
    - lambda: id(app).build_ui();
  style_definitions:
    - id: font_14
      text_font: montserrat_14
    - id: font_20
      text_font: montserrat_20
    - id: font_28
      text_font: montserrat_28
  pages:
    - id: main_page   # tagger_app fills this screen at boot
    - id: _uses
      skip: true
      widgets:
        - label:
            text: ""
        - button:
            widgets:
              - label:
                  text: ""
        - switch:
        - dropdown:
            options: ["-"]
        - roller:
            options: ["-"]
        - textarea:
        - keyboard:
        - spinbox:
        - slider:
        - checkbox:
        - buttonmatrix:
            rows:
              - buttons:
                  - text: "-"
        - spinner:
        - tabview:
            tabs:
              - name: "-"
